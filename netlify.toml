# ─────────────────────────────────────────────────────────────
# Solera Cask — Netlify configuration
#
# This file is the SINGLE source of redirects. There is no
# _redirects file: when both exist Netlify processes _redirects
# first, which silently shadowed the rules below.
#
# Netlify serves a matching static file before any 200 rewrite,
# so a file at /post/<slug>.html still wins over the /post/*
# rule. Remove the static file to let the CMS serve that post.
# ─────────────────────────────────────────────────────────────

[build]
  publish = "."

# Video files: correct MIME type and range requests for streaming
[[headers]]
  for = "/videos/*"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects (first match wins) ──────────────────────────────

# Netlify Functions API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pass video files through before the catch-all sees them
[[redirects]]
  from = "/videos/*"
  to = "/videos/:splat"
  status = 200

# Blog index
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog.html"
  status = 200

# Post pages: server-side rendered from the CMS for SEO.
# A static file at /post/<slug>.html overrides this.
[[redirects]]
  from = "/post/*"
  to = "/.netlify/functions/post-page"
  status = 200

# Admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Unknown URLs return a real 404, not a 200 copy of the homepage.
# A 200 here makes every typo a soft 404 in Google's eyes.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
