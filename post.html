        :root {
            --primary: #1c1c1c;
            --primary-light: #eadabd;
            --primary-dark: #938977;
            --accent-gold: #e8cd9b;
            --warm-white: #FEFEFE;
            --cream: #F8F6F0;
            --light-beige: #F5F3ED;
            --medium-beige: #E8E4DC;
            --rich-brown: #e8cd9b;
            --text-primary: #2C2C2C;
            --text-secondary: #5C5C5C;
            --text-light: #8C8C8C;
            --text-white: #FFFFFF;
            --border: #D4CFC4;
            --border-light: #E8E4DC;
            --shadow-subtle: 0 2px 12px rgba(160, 82, 45, 0.08);
            --shadow-medium: 0 6px 24px rgba(160, 82, 45, 0.12);
            --shadow-strong: 0 12px 48px rgba(160, 82, 45, 0.15);
        }
        /* Post page specific styles */
        .post-page {
            padding-top: 120px;
            min-height: 100vh;
            background: var(--warm-white);
        }

        .post-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 40px 80px;
            transition: max-width 0.3s ease;
        }

        /* Wide container for HTML posts */
        .post-container.html-content {
            max-width: 1200px;
        }

        /* Full-width container for HTML posts if needed */
        .post-container.html-content-full {
            max-width: 95%;
        }

        /* HTML content should respect its own width settings */
        .post-content.html-format {
            /* Let HTML content control its own width */
        }

        .post-content.html-format > div {
            /* This allows your HTML content's max-width to take precedence */
            margin: 0;
        }

        .post-header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-light);
        }

        .post-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .post-type {
            background: var(--primary);
            color: var(--text-white);
            padding: 6px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .post-date {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .reading-time {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .post-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 400;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.2;
        }

        .post-content {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 60px;
        }

        .post-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--text-primary);
            margin: 40px 0 24px;
        }

        .post-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--text-primary);
            margin: 32px 0 16px;
        }

        .post-content p {
            margin-bottom: 24px;
        }

        .post-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 32px 0;
            border-radius: 4px;
            box-shadow: var(--shadow-medium);
        }

        .post-content figure {
            margin: 32px 0;
            text-align: center;
        }

        .post-content figcaption {
            font-size: 14px;
            color: var(--text-light);
            font-style: italic;
            margin-top: 8px;
        }

        .external-link {
            background: var(--cream);
            border-left: 4px solid var(--primary);
            padding: 24px;
            margin: 40px 0;
        }

        .external-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .external-link a:hover {
            text-decoration: underline;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--border-light);
        }

        .post-tag {
            background: var(--light-beige);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 12px;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .post-tag:hover {
            background: var(--primary);
            color: var(--text-white);
            border-color: var(--primary);
        }

        .back-to-blog {
            text-align: center;
            margin-bottom: 40px;
        }

        .back-to-blog a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 12px 24px;
            border: 1px solid var(--primary);
            transition: all 0.3s ease;
        }

        .back-to-blog a:hover {
            background: var(--primary);
            color: var(--text-white);
        }

        .related-posts {
            margin-top: 80px;
            padding-top: 60px;
            border-top: 1px solid var(--border-light);
        }

        .related-posts h3 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 40px;
            text-align: center;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .related-post {
            border: 1px solid var(--border-light);
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .related-post:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .related-post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 12px;
        }

        .related-post h4 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .related-post p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .error-message {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .error-message h2 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .loading-message {
            text-align: center;
            padding: 120px 20px;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Featured image styling */
        .featured-image {
        width: 100%;
        max-width: 1200px;
        height: auto;
        border-radius: 8px;
        margin: 0 auto 40px;
        display: block;
        box-shadow: var(--shadow-medium);
}

        .post-author {
            font-size: 14px;
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 8px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .post-container {
                padding: 0 20px 60px;
            }

            .post-header {
                margin-bottom: 40px;
            }

            .post-meta {
                flex-direction: column;
                gap: 12px;
            }

            .post-content {
                font-size: 16px;
            }

            .related-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

    <script>
        // Enhanced Solera Cask Individual Post Page JavaScript with Full SEO Integration
        const SoleraBlogAPI = {
            // Determine API base URL based on environment
            API_BASE: window.location.hostname.includes('localhost') || window.location.hostname.includes('127.0.0.1')
                ? '/api' // Local development
                : '/.netlify/functions', // Netlify production

            // Get all published posts from database
            getAllPosts: async function() {
                try {
                    const response = await fetch(`${this.API_BASE}/posts-public`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching posts:', error);
                    return [];
                }
            },

            // Get single post by ID from database
            getPost: async function(id) {
                try {
                    const response = await fetch(`${this.API_BASE}/posts-public?id=${id}`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching post:', error);
                    return null;
                }
            },

            // Get single post by slug from database
            getPostBySlug: async function(slug) {
                try {
                    const response = await fetch(`${this.API_BASE}/posts-public?slug=${slug}`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching post by slug:', error);
                    return null;
                }
            },

            createPostSlug: function(post) {
                return post.title
                    .toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-')
                    .trim('-');
            }
        };

        // Enhanced SEO Meta Tag Updates with full integration
        function updateSEOMetaTags(post) {
            const currentUrl = window.location.href;
            const baseUrl = window.location.origin;
            
            // Generate SEO content with comprehensive fallbacks
            const seoData = generateSEOData(post, currentUrl, baseUrl);
            
            // Update basic meta tags
            document.getElementById('pageTitle').textContent = seoData.title;
            document.getElementById('pageDescription').setAttribute('content', seoData.description);
            document.getElementById('pageKeywords').setAttribute('content', seoData.keywords);
            document.getElementById('pageAuthor').setAttribute('content', seoData.author);
            
            // Handle robots meta tag for SEO control
            const robotsContent = seoData.noIndex ? 'noindex, nofollow' : 'index, follow';
            document.getElementById('pageRobots').setAttribute('content', robotsContent);
            
            // Update Open Graph tags
            document.getElementById('ogTitle').setAttribute('content', seoData.ogTitle);
            document.getElementById('ogDescription').setAttribute('content', seoData.ogDescription);
            document.getElementById('ogUrl').setAttribute('content', currentUrl);
            document.getElementById('ogImage').setAttribute('content', seoData.ogImage);
            
            // Update Twitter Card tags
            document.getElementById('twitterTitle').setAttribute('content', seoData.twitterTitle);
            document.getElementById('twitterDescription').setAttribute('content', seoData.twitterDescription);
            document.getElementById('twitterImage').setAttribute('content', seoData.twitterImage);
            
            // Update Article meta tags
            document.getElementById('articleAuthor').setAttribute('content', seoData.author);
            document.getElementById('articlePublished').setAttribute('content', seoData.publishedTime);
            document.getElementById('articleModified').setAttribute('content', seoData.modifiedTime);
            document.getElementById('articleSection').setAttribute('content', seoData.section);
            document.getElementById('articleTags').setAttribute('content', seoData.tags);
            
            // Update canonical URL
            const canonicalUrl = seoData.canonicalUrl || currentUrl;
            document.getElementById('canonicalUrl').setAttribute('href', canonicalUrl);
            
            // Update comprehensive JSON-LD structured data
            updateStructuredData(post, seoData, currentUrl, baseUrl);
            
            // Update page title in browser tab
            document.title = seoData.title;
            
            console.log('SEO meta tags updated:', seoData);
        }

        // Generate comprehensive SEO data with all fallbacks
        function generateSEOData(post, currentUrl, baseUrl) {
            // Base data with smart fallbacks
            const baseTitle = post.seoTitle || `${post.title} - Solera Cask`;
            const baseDescription = post.seoDescription || post.excerpt || 
                (post.content ? post.content.substring(0, 160).replace(/[#*`_\[\]()]/g, '').trim() + '...' : 'Premium sherry barrels from Jerez de la Frontera, Spain');
            
            const baseKeywords = post.seoKeywords || (post.tags ? post.tags.join(', ') : 'sherry barrels, whisky aging, rum finishing, Jerez, Spain');
            const baseImage = post.seoImage || post.featuredImage || '/images/logos/Solera-Cask-Logo.png';
            const fullImageUrl = baseImage.startsWith('http') ? baseImage : baseUrl + baseImage;
            
            return {
                // Basic SEO
                title: baseTitle,
                description: baseDescription,
                keywords: baseKeywords,
                author: post.author || 'Solera Cask',
                
                // Open Graph (with custom overrides if available)
                ogTitle: post.ogTitle || baseTitle,
                ogDescription: post.ogDescription || baseDescription,
                ogImage: fullImageUrl,
                
                // Twitter Cards (with custom overrides if available)
                twitterTitle: post.twitterTitle || baseTitle,
                twitterDescription: post.twitterDescription || baseDescription,
                twitterImage: fullImageUrl,
                
                // Article metadata
                publishedTime: new Date(post.date || post.createdAt).toISOString(),
                modifiedTime: new Date(post.updatedAt || post.date || post.createdAt).toISOString(),
                section: post.type || 'Article',
                tags: post.tags ? post.tags.join(', ') : '',
                
                // Advanced SEO
                canonicalUrl: post.canonicalUrl,
                noIndex: post.noIndex || false,
                
                // Additional metadata
                wordCount: post.wordCount || (post.content ? post.content.split(' ').length : 0),
                readingTime: post.readingTime || Math.ceil((post.content ? post.content.split(' ').length : 0) / 200)
            };
        }

        // Update comprehensive JSON-LD structured data
        function updateStructuredData(post, seoData, currentUrl, baseUrl) {
            const structuredData = {
                "@context": "https://schema.org",
                "@type": "Article",
                "headline": post.title,
                "description": seoData.description,
                "author": {
                    "@type": "Organization",
                    "name": seoData.author,
                    "url": baseUrl,
                    "logo": {
                        "@type": "ImageObject",
                        "url": baseUrl + "/images/logos/Solera-Cask-Logo.png"
                    }
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "Solera Cask",
                    "url": baseUrl,
                    "logo": {
                        "@type": "ImageObject",
                        "url": baseUrl + "/images/logos/Solera-Cask-Logo.png",
                        "width": 400,
                        "height": 400
                    }
                },
                "datePublished": seoData.publishedTime,
                "dateModified": seoData.modifiedTime,
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": currentUrl
                },
                "image": {
                    "@type": "ImageObject",
                    "url": seoData.ogImage,
                    "width": 1200,
                    "height": 630
                },
                "keywords": seoData.keywords,
                "articleSection": seoData.section,
                "wordCount": seoData.wordCount,
                "inLanguage": "en-US",
                "isPartOf": {
                    "@type": "WebSite",
                    "@id": baseUrl,
                    "name": "Solera Cask",
                    "description": "Premium sherry barrels from Jerez de la Frontera, Spain"
                }
            };

            // Add optional fields if available
            if (post.tags && post.tags.length > 0) {
                structuredData.about = post.tags.map(tag => ({
                    "@type": "Thing",
                    "name": tag
                }));
            }

            if (seoData.readingTime) {
                structuredData.timeRequired = `PT${seoData.readingTime}M`;
            }

            document.getElementById('structuredData').textContent = JSON.stringify(structuredData, null, 2);
        }

        // Get current post slug from URL
        function getCurrentPostSlug() {
            const path = window.location.pathname;
            const segments = path.split('/');
            
            // Handle different URL structures
            if (segments.includes('post') && segments.length > segments.indexOf('post') + 1) {
                return segments[segments.indexOf('post') + 1];
            }
            
            // Fallback: check for slug parameter
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('slug') || urlParams.get('post');
        }

        // Initialize post page
        document.addEventListener('DOMContentLoaded', function() {
            initializePostPage();
        });

        async function initializePostPage() {
            const postSlug = getCurrentPostSlug();
            
            if (!postSlug) {
                showError('No post specified');
                return;
            }
            
            console.log('Looking for post with slug:', postSlug);
            
            try {
                // Find post by slug from database
                const post = await SoleraBlogAPI.getPostBySlug(postSlug);
                
                if (!post || post.status !== 'published') {
                    console.error('Post not found for slug:', postSlug);
                    showError('Story not found');
                    return;
                }
                
                // Update SEO meta tags first (critical for social sharing)
                updateSEOMetaTags(post);
                
                // Render the post content
                renderPost(post);
                
                // Load related posts
                await loadRelatedPosts(post);
                
            } catch (error) {
                console.error('Error loading post:', error);
                showError('Failed to load story');
            }
        }

        function renderPost(post) {
            const loadingMessage = document.getElementById('loadingMessage');
            const postContent = document.getElementById('postContent');
            const postContainer = document.querySelector('.post-container');
            
            if (loadingMessage) loadingMessage.style.display = 'none';
            if (postContent) postContent.style.display = 'block';
            
            // Detect if this is an HTML post and adjust container width
            const isHtmlPost = post.contentHtml && post.contentHtml.trim();
            if (postContainer) {
                if (isHtmlPost) {
                    postContainer.classList.add('html-content');
                } else {
                    postContainer.classList.remove('html-content');
                }
            }
            
            // Update meta information with enhanced data
            const postMeta = document.getElementById('postMeta');
            if (postMeta) {
                let metaHtml = `<span class="post-type">${post.type}</span>`;
                metaHtml += `<span class="post-date">${formatDate(post.date)}</span>`;
                
                // Add reading time if available
                const readingTime = post.readingTime || Math.ceil((post.content ? post.content.split(' ').length : 0) / 200);
                if (readingTime > 0) {
                    metaHtml += `<span class="reading-time">${readingTime} min read</span>`;
                }
                
                if (post.featured) {
                    metaHtml += `<span class="featured-indicator">FEATURED</span>`;
                }
                
                postMeta.innerHTML = metaHtml;
            }
            
            // Update title
            const postTitle = document.getElementById('postTitle');
            if (postTitle) {
                postTitle.textContent = post.title;
            }
            
            // Update author if provided
            const postAuthor = document.getElementById('postAuthor');
            if (postAuthor && post.author && post.author !== 'Solera Cask') {
                postAuthor.textContent = `By ${post.author}`;
                postAuthor.style.display = 'block';
            }
            
            // Handle featured image
            const featuredImageContainer = document.getElementById('featuredImageContainer');
            const featuredImage = document.getElementById('featuredImage');
            const imageUrl = post.seoImage || post.featuredImage;
            
            if (featuredImageContainer && featuredImage && imageUrl && imageUrl !== '/images/logos/Solera-Cask-Logo.png') {
                featuredImage.src = imageUrl;
                featuredImage.alt = post.title;
                featuredImageContainer.style.display = 'block';
            }
            
            // Update content with enhanced HTML support
            const postText = document.getElementById('postText');
            if (postText) {
                if (isHtmlPost) {
                    postText.classList.add('html-format');
                } else {
                    postText.classList.remove('html-format');
                }
                
                postText.innerHTML = formatPostContent(post);
            }
            
            // Handle external link
            const externalLinkContainer = document.getElementById('externalLinkContainer');
            if (externalLinkContainer && post.link && post.link.trim() !== '') {
                externalLinkContainer.innerHTML = `
                    <div class="external-link">
                        <a href="${post.link}" target="_blank" rel="noopener noreferrer">
                            Read Original Source →
                        </a>
                    </div>
                `;
            }
            
            // Update tags
            const postTags = document.getElementById('postTags');
            if (postTags && post.tags && post.tags.length > 0) {
                postTags.innerHTML = post.tags.map(tag => `
                    <a href="/blog?search=${encodeURIComponent(tag)}" class="post-tag">#${tag}</a>
                `).join('');
            } else if (postTags) {
                postTags.style.display = 'none';
            }
        }

        async function loadRelatedPosts(currentPost) {
            try {
                const allPosts = await SoleraBlogAPI.getAllPosts();
                const otherPosts = allPosts.filter(post => post.id !== currentPost.id);
                
                // Enhanced related posts algorithm
                const relatedPosts = otherPosts
                    .map(post => {
                        let score = 0;
                        const sharedTags = post.tags ? post.tags.filter(tag => currentPost.tags && currentPost.tags.includes(tag)) : [];
                        score += sharedTags.length * 3; // Increased weight for shared tags
                        
                        if (post.type === currentPost.type) score += 2; // Same type gets points
                        
                        // Bonus for recent posts
                        const daysDiff = Math.abs(new Date(post.date) - new Date(currentPost.date)) / (1000 * 60 * 60 * 24);
                        if (daysDiff < 30) score += 1; // Recent posts get bonus
                        
                        return { post, score };
                    })
                    .filter(item => item.score > 0)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 3)
                    .map(item => item.post);
                
                const relatedContainer = document.getElementById('relatedPosts');
                if (relatedContainer) {
                    if (relatedPosts.length === 0) {
                        relatedContainer.innerHTML = '<p style="text-align: center; color: var(--text-light);">No related stories found.</p>';
                    } else {
                        relatedContainer.innerHTML = relatedPosts.map(post => `
                            <div class="related-post" onclick="navigateToPost('${post.id}')">
                                <div class="related-post-meta">
                                    <span class="post-type">${post.type}</span>
                                    <span class="post-date">${formatDate(post.date)}</span>
                                </div>
                                <h4>${post.title}</h4>
                                <p>${post.excerpt || (post.content || post.contentHtml || '').substring(0, 100)}...</p>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading related posts:', error);
            }
        }

        async function navigateToPost(postId) {
            try {
                const post = await SoleraBlogAPI.getPost(postId);
                if (post) {
                    const postSlug = SoleraBlogAPI.createPostSlug(post);
                    window.location.href = `/post/${postSlug}`;
                }
            } catch (error) {
                console.error('Error navigating to post:', error);
            }
        }

        // Enhanced content formatting with better HTML support
        function formatPostContent(post) {
            // If HTML content exists, use it directly
            if (post.contentHtml && post.contentHtml.trim()) {
                return post.contentHtml;
            }
            
            // Otherwise, format markdown content
            if (!post.content) return '';
            
            // Process all image markdown first, anywhere in content
            let content = post.content;
            
            // Convert markdown images to HTML (anywhere in text)
            content = content.replace(/!\[(.*?)\]\((.*?)\)/g, 
                '<figure><img src="$2" alt="$1" loading="lazy"><figcaption>$1</figcaption></figure>'
            );
            
            // Convert markdown links
            content = content.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            
            // Split into paragraphs and format
            const paragraphs = content.split('\n\n').filter(p => p.trim());
            
            return paragraphs.map(paragraph => {
                const trimmed = paragraph.trim();
                if (!trimmed) return '';
                
                // Format markdown-style elements
                let formatted = trimmed
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                
                // Handle headers
                if (formatted.startsWith('### ')) {
                    return `<h3>${formatted.substring(4)}</h3>`;
                } else if (formatted.startsWith('## ')) {
                    return `<h2>${formatted.substring(3)}</h2>`;
                } else if (formatted.startsWith('# ')) {
                    return `<h3>${formatted.substring(2)}</h3>`;
                }
                
                // Handle blockquotes
                if (formatted.startsWith('> ')) {
                    return `<blockquote>${formatted.substring(2)}</blockquote>`;
                }
                
                return `<p>${formatted}</p>`;
            }).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown date';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function showError(message) {
            const loadingMessage = document.getElementById('loadingMessage');
            const postContent = document.getElementById('postContent');
            const errorContent = document.getElementById('errorContent');
            
            if (loadingMessage) loadingMessage.style.display = 'none';
            if (postContent) postContent.style.display = 'none';
            if (errorContent) errorContent.style.display = 'block';
            
            console.error('Post page error:', message);
        }

        function closeMobileMenu() {
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
            
            if (mobileMenuOverlay && mobileMenuToggle) {
                mobileMenuOverlay.classList.remove('active');
                mobileMenuToggle.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // Export functions
        window.navigateToPost = navigateToPost;
        window.closeMobileMenu = closeMobileMenu;
        window.SoleraBlogAPI = SoleraBlogAPI;
        window.updateSEOMetaTags = updateSEOMetaTags;
    </script>
